seed: 42
candidate_count: 256
bootstrap_samples: 10000
training_config: configs/train_scaffold_a800.yaml

geometry:
  min_flank_length: 2
  min_total_scaffold_length: 8
  preferred_total_scaffold_length: 24
  max_length: 512

motif_panel:
  source_partition: test
  size: 48
  seed: 42
  motif_lengths: [4, 8, 16, 32]
  min_flank_length: 2
  min_common_motifs_for_release: 20

smoke_motifs:
  - id: motif_gugg
    sequence: GCGG
  - id: motif_augg
    sequence: AUGCGA

methods:
  - name: uniform
    kind: uniform
  - name: markov1
    kind: markov1
  - name: markov2
    kind: markov2
  - name: transformer_no_rnafm
    kind: checkpoint
    training_config: configs/train_scaffold_no_rnafm_a800.yaml
    training_manifest: checkpoints_scaffold_no_rnafm_a800/training_manifest.json
    device: cuda
    expected_pretrained_kind: none
    expected_pretrained_mode: none
    expected_decoder_mode: iterative_remasking
    expected_denoise_steps: 12
    generation: {denoise_steps: 12, top_p: 0.95}
  - name: transformer_frozen_rnafm
    kind: checkpoint
    training_config: configs/train_scaffold_frozen_rnafm_a800.yaml
    training_manifest: checkpoints_scaffold_frozen_rnafm_a800/training_manifest.json
    device: cuda
    expected_pretrained_kind: rna_fm
    expected_pretrained_mode: frozen
    expected_decoder_mode: iterative_remasking
    expected_denoise_steps: 12
    generation: {denoise_steps: 12, top_p: 0.95}
  - name: transformer_rnafm_lora_iterative
    kind: checkpoint
    training_config: configs/train_scaffold_a800.yaml
    training_manifest: checkpoints_scaffold_lora_rnafm_a800/training_manifest.json
    device: cuda
    primary: true
    expected_pretrained_kind: rna_fm
    expected_pretrained_mode: lora
    expected_decoder_mode: iterative_remasking
    expected_denoise_steps: 12
    generation: {denoise_steps: 12, top_p: 0.95}
  - name: single_pass_decoding
    kind: checkpoint
    training_config: configs/train_scaffold_a800.yaml
    training_manifest: checkpoints_scaffold_lora_rnafm_a800/training_manifest.json
    device: cuda
    expected_pretrained_kind: rna_fm
    expected_pretrained_mode: lora
    expected_decoder_mode: single_pass
    expected_denoise_steps: 1
    generation: {denoise_steps: 1, top_p: 0.95}

rnafold:
  enabled: false
  executable: RNAfold
  timeout_seconds: 30
  candidate_budget_per_motif: 256

output_dir: outputs/scaffold_benchmark
