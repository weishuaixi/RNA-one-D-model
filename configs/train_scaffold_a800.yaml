seed: 42

wandb:
  project: rna-one-d-model
  name: scaffold-a800-accuracy-512
  entity:
  log_model: false

data:
  train_data: "/home/weisx/workdir/igem one-model/stanford-rna-3d-folding-data/train_sequences.csv"
  task: motif_denoising
  min_motif_length: 4
  max_motif_length:
  motif_length_buckets:
    - [4, 15, 0.15]
    - [16, 31, 0.30]
    - [32, 63, 0.30]
    - [64, 127, 0.20]
    - [128, 512, 0.05]
  min_flank_length: 2
  min_total_scaffold_length: 8
  preferred_total_scaffold_length: 24
  full_mask_probability: 0.35
  span_mask_probability: 0.35
  min_random_mask_fraction: 0.30
  max_random_mask_fraction: 0.80
  mean_span_length: 8
  max_source_length: 512
  max_target_length: 512
  batch_size: 8
  num_workers: 12
  val_fraction: 0.05
  seed: 42

model:
  # OUR MODEL: motif-conditioned RNA scaffold generator (trainable)
  d_model: 768
  nhead: 12
  num_layers: 12
  dim_feedforward: 3072
  dropout: 0.1
  max_length: 512
  activation_checkpointing: true
  pretrained:
    # External frozen feature provider; this is not the scaffold generator.
    kind: rna_fm
    checkpoint:
    freeze: true
  lr: 0.0002
  weight_decay: 0.05
  length_loss_weight: 0.25
  position_loss_weight: 0.25
  label_smoothing: 0.05
  warmup_fraction: 0.05
  min_lr_fraction: 0.02

trainer:
  checkpoint_dir: checkpoints_scaffold_a800
  early_stopping_patience: 12
  resume_from_checkpoint:
  args:
    accelerator: gpu
    devices: 1
    precision: bf16-mixed
    max_epochs: 100
    gradient_clip_val: 1.0
    accumulate_grad_batches: 4
    log_every_n_steps: 10
    val_check_interval: 0.25
