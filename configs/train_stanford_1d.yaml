seed: 42

wandb:
  project: rna-one-d-model
  name: stanford-rna-1d-scaffold
  entity:
  log_model: false

data:
  train_data: F:/github_item/stanford-rna-3d-folding-data/train_sequences.csv
  task: motif_denoising
  min_motif_length: 4
  max_motif_length:
  motif_length_buckets:
    - [4, 15, 0.15]
    - [16, 31, 0.30]
    - [32, 63, 0.30]
    - [64, 127, 0.20]
    - [128, 512, 0.05]
  min_flank_length: 2
  min_total_scaffold_length: 8
  preferred_total_scaffold_length: 24
  max_source_length: 512
  max_target_length: 512
  batch_size: 16
  num_workers: 8
  val_fraction: 0.05
  seed: 42

model:
  d_model: 512
  nhead: 8
  num_layers: 8
  dim_feedforward: 2048
  dropout: 0.1
  max_length: 512
  activation_checkpointing: false
  pretrained:
    kind: none
    checkpoint:
    freeze: true
  lr: 0.0003
  weight_decay: 0.01
  length_loss_weight: 0.25
  position_loss_weight: 0.25

trainer:
  checkpoint_dir: checkpoints
  args:
    accelerator: gpu
    devices: 1
    precision: bf16-mixed
    max_epochs: 20
    gradient_clip_val: 1.0
    accumulate_grad_batches: 1
    log_every_n_steps: 20
    val_check_interval: 0.25
