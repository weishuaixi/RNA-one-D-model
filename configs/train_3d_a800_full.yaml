seed: 42

wandb:
  enabled: true
  project: rna-one-d-3d
  name: a800-card1-full-1536-safe
  entity:
  mode: online

data:
  source: cif_all_atom
  sequences_csv: "/home/weisx/workdir/igem one-model/stanford-rna-3d-folding-data/train_sequences.v2.csv"
  cif_dir: "/home/weisx/workdir/igem one-model/stanford-rna-3d-folding-data/PDB_RNA"
  cache_path: "/home/weisx/workdir/igem one-model/stanford-rna-3d-folding-data/cache/all_atom_1536.pt"
  max_records:
  max_sequence_length: 1536
  crop_length: 384
  min_atom_coverage: 0.5
  min_sequence_identity: 0.9
  min_sequence_coverage: 0.9
  center_coordinates: true
  external_holdout:
    sequences_csv: "/home/weisx/workdir/igem one-model/stanford-rna-3d-folding-data/validation_sequences.csv"
    manifest_path: checkpoints_3d_a800_full/holdout_exclusions.json
    kmer_size: 8
    jaccard_threshold: 0.8

model:
  type: rhofold
  d_model: 384
  nhead: 8
  num_e2e_layers: 6
  num_structure_layers: 4
  equivariant_layers: 2
  dim_feedforward: 1536
  dropout: 0.1
  max_len: 1536
  pair_dim: 128
  pair_heads: 4
  triangle_hidden_dim: 16
  triangle_chunk_size: 16
  msa_dim: 128
  num_distance_bins: 32
  recycle_iters: 2
  recycle_stop_gradient: true
  random_recycle_training: true
  activation_checkpointing: true
  sequence_loss_initial_weight: 0.1

optimizer:
  lr: 0.0002
  weight_decay: 0.01
  min_lr: 0.000001
  warmup_steps: 200
  coord_mse_weight: 0.2
  raw_coord_weight: 0.0
  pairwise_weight: 0.5
  local_distance_weight: 0.5
  soft_lddt_weight: 0.5
  pair_ce_weight: 0.1
  orientation_weight: 0.1
  fape_weight: 1.0
  clash_weight: 0.02
  bond_weight: 0.05
  angle_weight: 0.2
  torsion_weight: 0.02
  confidence_weight: 0.01
  inter_residue_weight: 0.2
  planarity_weight: 0.05
  sugar_weight: 0.1
  pucker_weight: 0.05
  base_orientation_weight: 0.1

trainer:
  accelerator: gpu
  cuda_device: 1
  batch_size: 1
  num_workers: 16
  persistent_workers: false
  max_epochs: 80
  val_fraction: 0.05
  validation_crops: 3
  sequence_split:
    manifest_path: checkpoints_3d_a800_full/split_manifest.json
    kmer_size: 8
    jaccard_threshold: 0.8
  checkpoint_dir: checkpoints_3d_a800_full
  checkpoint_metric: c1_lddt
  checkpoint_mode: max
  show_progress: true
  mixed_precision: true
  accumulate_grad_batches: 32
  gradient_clip_norm: 1.0
  sequence_mask_probability: 0.15
  scaffold_mask_probability: 0.25
  motif_length: 16
  random_rotation_augmentation: true
  random_translation_scale: 5.0
